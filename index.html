function init(){document.getElementById('stats').innerHTML=[['등록 사건',cases.length,'전체 사건'],['수사 중',cases.filter(c=>c.status==='수사 중').length,'진행 사건'],['미해결',cases.filter(c=>c.status==='미해결').length,'추가 확인 필요'],['종결',cases.filter(c=>c.status==='종결').length,'기록 보관']].map(([k,v,h])=>`<div class="stat"><div class="small">${k}</div><div class="number">${v.toString().padStart(2,'0')}</div><div class="hint">${h}</div></div>`).join('');document.getElementById('search').addEventListener('input',e=>{query=e.target.value;page=1;render()});document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;page=1;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('sel',b===btn));render()}));document.getElementById('prev').addEventListener('click',()=>{if(page>1){page--;render()}});document.getElementById('next').addEventListener('click',()=>{page++;render()});render()}
function current(){return cases.filter(c=>(filter==='전체'||c.status===filter)&&[c.id,c.name,c.category,c.owner,c.place].join(' ').toLowerCase().includes(query.toLowerCase()))}
function render(){const rows=current(),pages=Math.max(1,Math.ceil(rows.length/PAGE));page=Math.min(page,pages);document.getElementById('count').textContent=`(${rows.length})`;const view=rows.slice((page-1)*PAGE,page*PAGE);document.getElementById('caseRows').innerHTML=view.length?view.map(c=>`<button type="button" class="case" data-id="${c.id}" aria-label="${escapeHTML(c.name)} 상세 열람"><span class="case-code">${c.id}<small>${c.date}</small></span><span><span class="case-name">${escapeHTML(c.name)}</span><span class="case-meta">${escapeHTML(c.category)} · ${escapeHTML(c.place)}</span></span><span class="state ${statusClass(c.status)}">${c.status}</span><span class="owner">${escapeHTML(c.owner)}</span><span class="arrow">›</span></button>`).join(''):'<div class="empty">검색 결과가 없습니다. 다른 검색어나 필터를 선택하세요.</div>';document.querySelectorAll('.case').forEach(b=>b.addEventListener('click',()=>openCase(b.dataset.id)));document.getElementById('pageInfo').textContent=`${page} / ${pages} 페이지`;document.getElementById('prev').disabled=page===1;document.getElementById('next').disabled=page===pages}
function openCase(id){selected=cases.find(c=>c.id===id);if(!selected)return;activeTab='개요';document.getElementById('dashboard').classList.replace('visible','hidden');document.getElementById('detail').classList.add('visible');document.getElementById('mainTitle').textContent='사건 상세 기록';document.getElementById('subtitle').textContent='사건 관련 자료를 열람합니다.';const c=selected;document.getElementById('detailHead').innerHTML=`<div class="eyebrow">CASE DOSSIER / ${c.id}</div><div class="dhead"><h2>${escapeHTML(c.name)}</h2><span class="state ${statusClass(c.status)}">${c.status}</span></div><div class="details-meta"><span>사건번호: ${c.id}</span><span>등록: ${c.date}</span><span>담당: ${escapeHTML(c.owner)}</span></div>`;renderTab();window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){selected=null;document.getElementById('detail').classList.remove('visible');document.getElementById('dashboard').classList.replace('hidden','visible');document.getElementById('mainTitle').textContent='사건 관리 대시보드';document.getElementById('subtitle').textContent='등록된 사건을 검색하고 수사 자료를 열람합니다.';window.scrollTo({top:0,behavior:'smooth'})}
function renderTab(){let c=selected;if(!c)return;document.getElementById('tabs').innerHTML=['개요','관련 인물','증거 자료','수사 일지','비공개 자료'].map(t=>`<button class="tab ${activeTab===t?'selected':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;renderTab()}));let html='';if(activeTab==='개요'){html=`<h3>사건 개요</h3><div class="note">${escapeHTML(c.summary)}</div><div class="info-grid"><div class="info"><b>사건번호</b><span>${c.id}</span></div><div class="info"><b>사건 분류</b><span>${escapeHTML(c.category)}</span></div><div class="info"><b>발생 / 관련 지역</b><span>${escapeHTML(c.place)}</span></div><div class="info"><b>담당 수사관</b><span>${escapeHTML(c.owner)}</span></div><div class="info"><b>수사 현황</b><span>${c.status}</span></div><div class="info"><b>최신 기록일</b><span>${c.date}</span></div></div>`}else if(activeTab==='관련 인물'){html=`<h3>관련 인물 (${c.persons.length})</h3>`+c.persons.map(([name,role,note],i)=>`<div class="entry"><div class="dot">${String(i+1).padStart(2,'0')}</div><div><strong>${escapeHTML(name)} <span style="color:#849ab2;font-weight:400">/ ${escapeHTML(role)}</span></strong><p>${escapeHTML(note)}</p></div></div>`).join('')}else if(activeTab==='증거 자료'){html=`<h3>증거 목록 (${c.evidence.length})</h3>`+c.evidence.map(([id,name,note])=>`<div class="entry"><div class="dot">◇</div><div><strong>${escapeHTML(id)} · ${escapeHTML(name)}</strong><p>${escapeHTML(note)}</p></div></div>`).join('')+'<p style="color:#7c94ad;font-size:11px;margin-top:22px">※ 실제 영상·사진 파일은 포함되지 않은 창작 예시입니다.</p>'}else if(activeTab==='수사 일지'){html=`<h3>수사 진행 기록</h3>`+c.history.map(([date,title,note])=>`<div class="entry"><div class="dot">${escapeHTML(date.slice(-2))}</div><div><strong>${escapeHTML(date)} · ${escapeHTML(title)}</strong><p>${escapeHTML(note)}</p></div></div>`).join('')}else{html='<h3>비공개 자료</h3><div class="restricted"><strong>🔒 제한 문서</strong>현재 샘플에는 추가 자료가 설정되어 있지 않습니다.<br><span style="font-size:12px">실제 버전에서는 암호 입력 · 특정 사건만 공개 등을 구현할 수 있습니다.</span></div>'}document.getElementById('sheet').innerHTML=html}
function showMessage(msg){alert(msg)}init();
</script></body></html>
